<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FS Store | Finalizar compra</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/estilos.css">

</head>

<body>

<nav class="navbar navbar-dark bg-black">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html">
            FS STORE
        </a>

    </div>

</nav>


<main class="container py-5">

    <h1 class="mb-4">
        Finalizar compra
    </h1>


    <div class="row">

        <div class="col-lg-7">

            <form
                id="checkoutForm"
                class="card shadow-sm p-4">

                <h4 class="mb-4">
                    Información de envío
                </h4>


                <div class="mb-3">

                    <label class="form-label">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        class="form-control"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        class="form-control"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Dirección
                    </label>

                    <input
                        type="text"
                        id="direccion"
                        class="form-control"
                        required>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Ciudad
                        </label>

                        <input
                            type="text"
                            id="ciudad"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Código postal
                        </label>

                        <input
                            type="text"
                            id="codigoPostal"
                            class="form-control">

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-dark btn-lg w-100">

                    Confirmar pedido

                </button>

            </form>

        </div>


        <div class="col-lg-5 mt-4 mt-lg-0">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h4>
                        Resumen del pedido
                    </h4>

                    <hr>

                    <div id="resumenPedido"></div>

                    <hr>

                    <div class="d-flex justify-content-between">

                        <strong>
                            Total
                        </strong>

                        <strong id="totalCheckout">
                            $0
                        </strong>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="js/productos.js"></script>
<script src="js/carrito.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const carrito = obtenerCarrito();

        const resumen =
            document.getElementById(
                "resumenPedido"
            );

        const total =
            document.getElementById(
                "totalCheckout"
            );


        if (carrito.length === 0) {

            resumen.innerHTML = `

                <p class="text-muted">
                    Tu carrito está vacío.
                </p>

                <a
                    href="productos.html"
                    class="btn btn-dark">

                    Comprar productos

                </a>

            `;

            return;

        }


        resumen.innerHTML =
            carrito.map(producto => `

                <div class="d-flex justify-content-between mb-3">

                    <span>
                        ${producto.nombre}
                        x${producto.cantidad}
                    </span>

                    <strong>
                        ${formatoPrecio(
                            producto.precio *
                            producto.cantidad
                        )}
                    </strong>

                </div>

            `).join("");


        total.textContent =
            formatoPrecio(calcularTotal());

    }


);


document
    .getElementById("checkoutForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const carrito =
                obtenerCarrito();


            if (carrito.length === 0) {

                alert(
                    "No tienes productos en el carrito."
                );

                return;

            }


            const pedido = {

                id:
                    "FS-" +
                    Date.now(),

                cliente: {

                    nombre:
                        document.getElementById(
                            "nombre"
                        ).value,

                    email:
                        document.getElementById(
                            "email"
                        ).value,

                    telefono:
                        document.getElementById(
                            "telefono"
                        ).value,

                    direccion:
                        document.getElementById(
                            "direccion"
                        ).value,

                    ciudad:
                        document.getElementById(
                            "ciudad"
                        ).value

                },

                productos: carrito,

                total: calcularTotal(),

                fecha:
                    new Date().toLocaleString(
                        "es-CO"
                    )

            };


            localStorage.setItem(
                "ultimoPedido",
                JSON.stringify(pedido)
            );


            localStorage.removeItem(
                "carrito"
            );


            alert(
                "¡Pedido realizado correctamente! " +
                "Número de pedido: " +
                pedido.id
            );


            window.location.href =
                "index.html";

        }
    );

</script>

</body>
</html>
