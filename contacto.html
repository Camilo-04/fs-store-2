<!-- =========================
     CONTACTO
========================= -->

<main class="container py-5">


    <!-- TÍTULO -->

    <div class="text-center mb-5">

        <h1>

            Contáctanos

        </h1>

        <p class="text-muted">

            Estamos aquí para ayudarte.

        </p>

    </div>



    <!-- FORMULARIO -->

    <div class="row justify-content-center">

        <div class="col-lg-7">


            <form
                id="contactoForm"
                class="card shadow-sm p-4">


                <!-- NOMBRE -->

                <div class="mb-3">

                    <label
                        for="nombre"
                        class="form-label">

                        Nombre

                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        class="form-control"
                        placeholder="Escribe tu nombre"
                        required>

                </div>


                <!-- CORREO -->

                <div class="mb-3">

                    <label
                        for="correo"
                        class="form-label">

                        Correo electrónico

                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        class="form-control"
                        placeholder="ejemplo@correo.com"
                        required>

                </div>


                <!-- ASUNTO -->

                <div class="mb-3">

                    <label
                        for="asunto"
                        class="form-label">

                        Asunto

                    </label>

                    <input
                        type="text"
                        id="asunto"
                        name="asunto"
                        class="form-control"
                        placeholder="¿En qué podemos ayudarte?"
                        required>

                </div>


                <!-- MENSAJE -->

                <div class="mb-3">

                    <label
                        for="mensaje"
                        class="form-label">

                        Mensaje

                    </label>

                    <textarea
                        id="mensaje"
                        name="mensaje"
                        class="form-control"
                        rows="5"
                        placeholder="Escribe tu mensaje..."
                        required></textarea>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="btn btn-dark w-100">

                    <i class="bi bi-send"></i>

                    Enviar mensaje

                </button>


            </form>

        </div>

    </div>


</main>

     FOOTER
========================= -->

    <div class="container">


        <div class="row">


            <!-- INFORMACIÓN -->

            <div class="col-md-6">

                    FS STORE

                </h4>

                    Moda, estilo y elegancia.

                </p>

            </div>


            <!-- REDES -->

            <div class="col-md-6 text-md-end">

                <h5>

                    Síguenos

                </h5>


                <div class="socials">


                    <a href="#">

                        <i class="bi bi-facebook"></i>

                    </a>


                    <a href="#">

                        <i class="bi bi-instagram"></i>

                    </a>


                    <a href="#">

                        <i class="bi bi-twitter-x"></i>

                    </a>


                    <a href="#">

                        <i class="bi bi-whatsapp"></i>

                    </a>


                </div>

            </div>


        </div>


        <hr>


        <p class="text-center mb-0">

            © 2026 FS STORE - Todos los derechos reservados.

        </p>


    </div>

</footer>

<!-- =========================
     FORMULARIO
========================= -->

<script>

document
    .getElementById("contactoForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            alert(
                "Mensaje enviado correctamente."
            );

            this.reset();

        }
    );

</script>
