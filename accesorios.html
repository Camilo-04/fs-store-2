<!-- =========================
     PRODUCTOS
========================= -->

<section class="container pb-5">


    <!-- BUSCADOR Y ORDEN -->

    <div class="filters mb-5">

        <div class="row g-3">


            <!-- BUSCAR -->

            <div class="col-md-8">

                <label
                    for="buscador"
                    class="form-label">

                    Buscar

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-search"></i>

                    </span>

                    <input
                        type="text"
                        id="buscador"
                        class="form-control"
                        placeholder="Buscar accesorios...">

                </div>

            </div>


            <!-- ORDENAR -->

            <div class="col-md-4">

                <label
                    for="ordenar"
                    class="form-label">

                    Ordenar

                </label>

                <select
                    id="ordenar"
                    class="form-select">

                    <option value="default">
                        Más relevantes
                    </option>

                    <option value="menor">
                        Precio: menor a mayor
                    </option>

                    <option value="mayor">
                        Precio: mayor a menor
                    </option>

                    <option value="nombre">
                        Nombre A-Z
                    </option>

                </select>

            </div>

        </div>

    </div>


    <!-- LISTA DE PRODUCTOS -->

    <div
        id="listaProductos"
        class="row g-4">

    </div>


</section>
