<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FS Store | Carrito</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        href="css/estilos.css">

</head>

<body>

<nav class="navbar navbar-dark bg-black">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html">

            FS STORE

        </a>

        <a
            href="productos.html"
            class="btn btn-light">

            <i class="bi bi-arrow-left"></i>
            Seguir comprando

        </a>

    </div>

</nav>


<main class="container py-5">

    <h1 class="mb-4">
        Mi carrito
    </h1>


    <div class="row">

        <div class="col-lg-8">

            <div id="contenidoCarrito"></div>

        </div>


        <div class="col-lg-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h4>
                        Resumen
                    </h4>

                    <hr>

                    <div
                        class="d-flex justify-content-between">

                        <span>
                            Total
                        </span>

                        <strong id="totalCarrito">
                            $0
                        </strong>

                    </div>

                    <a
                        href="checkout.html"
                        class="btn btn-dark w-100 mt-4">

                        Continuar compra

                    </a>

                </div>

            </div>

        </div>

    </div>

</main>


<footer>

    <div class="container text-center">

        <p>
            © 2026 FS STORE
        </p>

    </div>

</footer>


<script src="js/productos.js"></script>
<script src="js/carrito.js"></script>

</body>
</html>
