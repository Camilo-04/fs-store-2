    <!-- CSS PROPIO -->

    <link

</head>

========================= -->

            href="index.html">

            FS STORE

        </a>


        <!-- BOTÓN MÓVIL -->

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
            aria-controls="menu"
            aria-expanded="false"
            aria-label="Mostrar menú">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- MENÚ -->

        <div
            class="collapse navbar-collapse"
            id="menu">


            <ul
                class="navbar-nav ms-auto align-items-lg-center">


                <!-- INICIO -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="index.html">

                        Inicio

                    </a>

                </li>


                <!-- NOSOTROS -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="sobrenosotros.html">

                        Nosotros

                    </a>

                </li>


                <!-- CONTACTO -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="contacto.html">

                        Contacto

                    </a>

                </li>





                <!-- CARRITO -->

                <li class="nav-item ms-lg-2">

                    <a
                        class="nav-link cart-link"
                        href="carrito.html">

                        <i class="bi bi-cart3"></i>

                        Carrito

                        <span
                            id="contadorCarrito"
                            class="badge bg-danger">

                            0

                        </span>

                    </a>

                </li>


            </ul>

        </div>

    </div>

</nav>



<!-- =========================
     CATÁLOGO
========================= -->

<section class="container py-5">


    <!-- TÍTULO -->

    <div class="text-center mb-5">

        <h1>
            Nuestra colección
        </h1>

        <p class="text-muted">
            Encuentra el estilo perfecto para ti.
        </p>

    </div>



    <!-- =========================
         FILTROS
    ========================= -->

    <div class="filters mb-5">

        <div class="row g-3">


            <!-- BUSCAR -->

            <div class="col-md-5">

                <label
                    for="buscador"
                    class="form-label">

                    Buscar

                </label>


                <div class="input-group">

                    <span
                        class="input-group-text">

                        <i class="bi bi-search"></i>

                    </span>


                    <input
                        type="text"
                        id="buscador"
                        class="form-control"
                        placeholder="Buscar producto...">

                </div>

            </div>



            <!-- CATEGORÍA -->

            <div class="col-md-3">

                <label
                    for="filtroCategoria"
                    class="form-label">

                    Categoría

                </label>


                <select
                    id="filtroCategoria"
                    class="form-select">


                    <option value="todos">
                        Todas
                    </option>


                    <option value="hombre">
                        Hombres
                    </option>


                    <option value="mujer">
                        Mujeres
                    </option>


                    <option value="accesorios">
                        Accesorios
                    </option>


                </select>

            </div>



            <!-- ORDENAR -->

            <div class="col-md-4">

                <label
                    for="ordenar"
                    class="form-label">

                    Ordenar

                </label>


                <select
                    id="ordenar"
                    class="form-select">


                    <option value="default">
                        Más relevantes
                    </option>


                    <option value="menor">
                        Precio: menor a mayor
                    </option>


                    <option value="mayor">
                        Precio: mayor a menor
                    </option>


                    <option value="nombre">
                        Nombre A-Z
                    </option>


                </select>

            </div>


        </div>

    </div>



    <!-- =========================
         LISTA DE PRODUCTOS
    ========================= -->

    <div
        id="listaProductos"
        class="row g-4">

    </div>


</section>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <div class="container">

        <div class="row">


            <div class="col-md-6">

                <h4>
                    FS STORE
                </h4>

                <p>
                    Moda, estilo y elegancia.
                </p>

            </div>


            <div class="col-md-6 text-md-end">

                <h5>
                    Síguenos
                </h5>

                <div class="socials">

                    <a href="#">
                        <i class="bi bi-facebook"></i>
                    </a>

                    <a href="#">
                        <i class="bi bi-instagram"></i>
                    </a>

                    <a href="#">
                        <i class="bi bi-twitter-x"></i>
                    </a>

                    <a href="#">
                        <i class="bi bi-whatsapp"></i>
                    </a>

                </div>

            </div>

        </div>


        <hr>


        <p class="text-center mb-0">

            © 2026 FS STORE - Todos los derechos reservados.

        </p>

    </div>

</footer>
